name: Dev build

# Every push to main becomes the rolling "dev" pre-release that the app's
# Dev channel installs. Pull requests only build.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Version
        id: version
        run: |
          base=$(grep '^kontor.version=' gradle.properties | cut -d= -f2)
          count=$(git rev-list --count HEAD)
          echo "code=$count" >> "$GITHUB_OUTPUT"
          echo "name=$base-dev.$count" >> "$GITHUB_OUTPUT"

      - name: Signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KONTOR_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kontor.jks"
          echo "KONTOR_KEYSTORE=$RUNNER_TEMP/kontor.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          KONTOR_VERSION_CODE: ${{ steps.version.outputs.code }}
          KONTOR_VERSION_NAME: ${{ steps.version.outputs.name }}
          KONTOR_CHANNEL: dev
          KONTOR_KEYSTORE_PASSWORD: ${{ secrets.KONTOR_KEYSTORE_PASSWORD }}
          KONTOR_KEY_ALIAS: ${{ secrets.KONTOR_KEY_ALIAS }}
          KONTOR_KEY_PASSWORD: ${{ secrets.KONTOR_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-configuration-cache
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Kontor-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: Kontor-${{ steps.version.outputs.name }}
          path: out/*.apk

      - name: Publish dev release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "Automatischer Dev-Build von \`${GITHUB_SHA::7}\`. Installierbar über Kontor → Einstellungen → Updates → Kanal „Dev“."
            echo
            echo "### Änderungen${last:+ seit $last}"
            git log ${last:+$last..}HEAD --no-merges --pretty='- %s' | head -40
            echo
            echo "<!-- versionCode: $CODE -->"
            echo "<!-- versionName: $NAME -->"
          } > notes.md
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          gh release create dev "out/Kontor-$NAME.apk" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Dev $NAME" --notes-file notes.md
