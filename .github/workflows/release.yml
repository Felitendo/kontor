name: Release

# Pushing a tag like v1.2.0 publishes a stable release for the app's Stable channel.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Version
        id: version
        run: |
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KONTOR_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kontor.jks"
          echo "KONTOR_KEYSTORE=$RUNNER_TEMP/kontor.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          KONTOR_VERSION_CODE: ${{ steps.version.outputs.code }}
          KONTOR_VERSION_NAME: ${{ steps.version.outputs.name }}
          KONTOR_CHANNEL: stable
          KONTOR_KEYSTORE_PASSWORD: ${{ secrets.KONTOR_KEYSTORE_PASSWORD }}
          KONTOR_KEY_ALIAS: ${{ secrets.KONTOR_KEY_ALIAS }}
          KONTOR_KEY_PASSWORD: ${{ secrets.KONTOR_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-configuration-cache
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Kontor-${{ steps.version.outputs.name }}.apk"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            if [ -f "docs/release-notes/$GITHUB_REF_NAME.md" ]; then
              cat "docs/release-notes/$GITHUB_REF_NAME.md"
              echo
            fi
            echo "### Änderungen${prev:+ seit $prev}"
            git log ${prev:+$prev..}HEAD --no-merges --pretty='- %s' | head -60
            echo
            echo "<!-- versionCode: $CODE -->"
            echo "<!-- versionName: $NAME -->"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "out/Kontor-$NAME.apk" \
            --title "Kontor $NAME" --notes-file notes.md --latest
